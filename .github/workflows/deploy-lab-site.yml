name: Deploy laboratory website

on:
  push:
    branches: [codex/lab-website]
    paths:
      - computational-mineral-physics-github-pages-2026-11-18.zip
      - .github/workflows/deploy-lab-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website
        run: |
          mkdir site
          unzip -q computational-mineral-physics-github-pages-2026-11-18.zip -d site
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
